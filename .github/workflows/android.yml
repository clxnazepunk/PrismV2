name: Prism Android

on:
  push:
    branches: [main, chore/prism-development-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: false
      - uses: ./.github/actions/prepare-gradle
      - name: Install Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Build side-by-side Prism Dev
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug -PsideBySide=dev
      - name: Record APK checksums
        working-directory: app/build/outputs/apk/debug
        run: sha256sum *.apk > checksums.sha256
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prism-dev-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/checksums.sha256
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Android unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: false
      - uses: ./.github/actions/prepare-gradle
      - name: Install Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0"
      - run: chmod +x gradlew
      # Upstream's unit suite includes live-endpoint tests. Keep failures visible.
      - name: Run existing unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest -PsideBySide=dev
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prism-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: false
      - uses: ./.github/actions/prepare-gradle
      - name: Install Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Run lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug -PsideBySide=dev
      - name: Show diagnostics in customized files
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/lint_customizations.py
      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prism-lint-${{ github.run_number }}
          path: app/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 14

  suggestions:
    name: Artist identities and playlist focused tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: false
      - uses: ./.github/actions/prepare-gradle
      - name: Install Android SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - run: chmod +x gradlew
      - name: Check artists, backups, translations and playlists
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest -PsideBySide=dev --tests '*PlaylistSuggestionsTest*' --tests '*PrismLibraryTest*' --tests '*ArtistImageSourcesTest*' --tests '*ArtistIdentityStoreTest*' --tests '*ArtistIdentityBackupTest*' --tests '*BackupPartsTest*' --tests '*TranslationsTest*' --tests '*OfflineArtistsTest*' --tests '*SavedArtistProfilesTest*' --tests '*ArtistPersonalizationBackupTest*'
      - name: Upload focused test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prism-playlist-suggestions-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
